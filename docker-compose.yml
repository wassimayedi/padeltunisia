# The app serves plain HTTP on port 3006; put a reverse proxy (or Cloudflare Tunnel) in front for HTTPS.
# On the server: docker compose up -d --build   (reads POSTGRES_PASSWORD from .env)
# Migrations and seed are run by hand: npm run db:migrate && npm run db:seed
# Local dev, database only: docker compose up -d padeltunisia-db
services:
  padeltunisia-db:
    image: postgres:17-alpine
    container_name: padeltunisia-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: padel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: padeltunisia
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Loopback only: reachable from this machine (dev, backups), never from the internet.
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U padel -d padeltunisia"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        VITE_SITE_URL: ${VITE_SITE_URL:-https://padeltunisia.tn}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://padel:${POSTGRES_PASSWORD}@padeltunisia-db:5432/padeltunisia
      # Google Analytics 4 measurement ID (G-…); read at runtime, leave empty to disable.
      GA_ID: ${GA_ID:-}
      UPLOADS_DIR: /app/uploads
    # Images added by the MCP tools on the host (scripts/mcp), served at /uploads/….
    volumes:
      - ./uploads:/app/uploads:ro
    ports:
      - "3006:3000"
    depends_on:
      padeltunisia-db:
        condition: service_healthy

volumes:
  pgdata:
